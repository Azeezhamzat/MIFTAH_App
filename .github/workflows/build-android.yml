name: Build Android APK

# Manual on-demand build. Unlike the desktop builds, this doesn't need the
# Next.js app built at all — the Android app is a Capacitor WebView shell
# pointed at a running Miftāḥ server (see capacitor.config.json's
# server.url), so packaging it only needs the Android SDK/Gradle, which
# GitHub's runner doesn't ship by default (unlike Wine for Windows cross-
# builds or Xcode for macOS, both already present on their respective
# native runners).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync the Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miftah-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
